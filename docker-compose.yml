services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    environment:
      APP_BIND_ADDR: 0.0.0.0:8080
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: open_comms
      RUST_LOG: info,open_comms_server=debug
      WEB_DIST_DIR: /app/web
      MEDIA_BIND_ADDR: 0.0.0.0:3478
      MEDIA_ADVERTISE_ADDR: ${MEDIA_ADVERTISE_ADDR:-127.0.0.1:3478}
    ports:
      - "8080:8080"
      - "3478:3478/udp"
    depends_on:
      - mongo

  # Opt-in dev-only HTTPS reverse proxy with a generated self-signed CA.
  # Start with: docker compose --profile https up --build
  https:
    build:
      context: ./deploy/dev-https
    profiles:
      - https
    restart: unless-stopped
    environment:
      HTTPS_HOSTS: ${HTTPS_HOSTS:-}
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/dev-https/certs:/etc/nginx/dev-https
    depends_on:
      - server

volumes:
  mongo_data:
