[package]
name = "open-comms-desktop"
version = "0.1.0"
description = "Windows WebView2 shell for local testing of Open Comms"
edition = "2021"

[lib]
name = "open_comms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Keep this Tauri shell out of the server workspace.
[workspace]
